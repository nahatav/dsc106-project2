<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Child Mortality Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: "Libre Franklin", "Franklin Gothic Book", Arial, sans-serif; color: #333; }
  #wrap { width: 720px; padding: 22px 24px 16px; box-sizing: border-box; }
  h1 { color: #121212; font-weight: 700; font-size: 20px; line-height: 1.28; margin: 0 0 4px; text-wrap: balance; }
  .dek { font-size: 14px; line-height: 1.45; color: #555; font-weight: 500; margin: 0 0 22px; }
  .src { font-size: 11.5px; color: #777; font-weight: 500; margin-top: 10px; line-height: 1.5; }
  svg { display: block; overflow: visible; }
  svg text { font-family: inherit; }
  .tick { font-size: 11.5px; font-weight: 500; fill: #6e6e6e; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; font-variant-numeric: tabular-nums; }
  .grid { stroke: #e9eaee; stroke-width: 1; shape-rendering: crispEdges; }
  .base { stroke: #9a9aa4; stroke-width: 1; shape-rendering: crispEdges; }
  .country { fill: none; stroke: #000; stroke-opacity: 0.06; stroke-width: 0.8; stroke-linejoin: round; }
  .ann { font-size: 12.5px; font-weight: 500; fill: #222; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .ann-b { font-weight: 800; fill: #121212; }
  .lab { font-size: 12px; font-weight: 700; }
  .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .ptitle { font-size: 14px; font-weight: 700; fill: #121212; }
  .psub { font-size: 12px; font-weight: 500; fill: #666; }
  .mk circle { stroke: #fff; stroke-width: 2; }
  .mk text { font-size: 11.5px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title"></h1>
  <p class="dek" id="dek"></p>
  <svg id="chart"></svg>
  <div class="src" id="src"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const WHICH = params.get("v") || "for";
const REVEAL = params.has("reveal");
const W = 672;
const svg = d3.select("#chart").attr("width", W);
const gBack = svg.append("g"), g = svg.append("g"), gTop = svg.append("g"), gMk = svg.append("g");
// one decimal, rounded half up (matches the checkpoint script)
const f1 = v => (Math.round(v * 10 + 1e-9) / 10).toFixed(1);

function block(sel, x, y, lines, opts = {}) {
  const t = sel.append("text").attr("x", x).attr("y", y).attr("class", opts.cls || "ann").attr("text-anchor", opts.anchor || "start");
  lines.forEach((ln, i) => {
    const parts = Array.isArray(ln) ? ln : [[ln, ""]];
    parts.forEach(([s, c], j) => {
      const ts = t.append("tspan").text(s);
      if (c) ts.attr("class", c);
      if (j === 0) ts.attr("x", x).attr("dy", i === 0 ? 0 : (opts.lh || 17));
    });
  });
  return t;
}
function marker(n, x, y, color) {
  if (!REVEAL) return;
  const m = gMk.append("g").attr("class", "mk").attr("transform", `translate(${x},${y})`);
  m.append("circle").attr("r", 10.5).attr("fill", color);
  m.append("text").text(n);
}

d3.json("data.json").then(D => (WHICH === "for" ? drawFor : drawAgainst)(D));

function drawFor(D) {
  const GOLD = "#a87b16", GOLD_FILL = "#f5ead0", INK = "#1d1d22";
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const drop = Math.round(100 * (1 - s1.gap / s0.gap));
  d3.select("#title").text(`The country gap in child survival narrowed by ${drop}%`);
  d3.select("#dek").text("Deaths before age 5 per 1,000 live births in the 112 countries with data in both 1960 and 2019. Each gray line is a country, and the shaded band spans the 10th to the 90th percentile.");
  d3.select("#src").text("Source: World Bank Human Development Indicators, 1960 to 2020. Percentiles use the nearest rank and count every country equally.");

  // ---- panel A: spread over time
  const A = { t: 8, h: 290, l: 30, r: 118 };
  const x = d3.scaleLinear().domain([1960, 2019]).range([A.l, W - A.r]);
  const y = d3.scaleLinear().domain([0, 400]).range([A.t + A.h, A.t]);
  [100, 200, 300, 400].forEach(v => {
    gBack.append("line").attr("class", "grid").attr("x1", 0).attr("x2", W - A.r).attr("y1", y(v)).attr("y2", y(v));
    gTop.append("text").attr("class", "tick").attr("x", 0).attr("y", y(v) - 5).text(v === 400 ? "400 deaths per 1,000 births" : v);
  });
  g.append("line").attr("class", "base").attr("x1", 0).attr("x2", W - A.r).attr("y1", y(0)).attr("y2", y(0));
  [1960, 1970, 1980, 1990, 2000, 2010, 2019].forEach(v => gTop.append("text").attr("class", "tick").attr("x", x(v)).attr("y", y(0) + 17)
    .attr("text-anchor", v === 2019 ? "end" : "middle").text(v));

  g.append("path").datum(S).attr("fill", GOLD_FILL).attr("opacity", 0.55)
    .attr("d", d3.area().x(d => x(d.y)).y0(d => y(d.p10)).y1(d => y(d.p90)).curve(d3.curveMonotoneX));
  const line = d3.line().x(d => x(d[0])).y(d => y(d[1])).curve(d3.curveMonotoneX);
  g.append("g").selectAll("path").data(D.cohort).join("path").attr("class", "country").attr("d", c => line(c.v));
  const ql = k => d3.line().x(d => x(d.y)).y(d => y(d[k])).curve(d3.curveMonotoneX);
  ["p10", "p90"].forEach(k => g.append("path").datum(S).attr("fill", "none").attr("stroke", GOLD).attr("stroke-width", 2.2).attr("d", ql(k)));
  g.append("path").datum(S).attr("fill", "none").attr("stroke", "#555").attr("stroke-width", 1.3).attr("stroke-dasharray", "3 3").attr("d", ql("med"));
  [["p90", GOLD], ["med", "#555"], ["p10", GOLD]].forEach(([k, c]) => g.append("circle").attr("cx", x(2019)).attr("cy", y(s1[k])).attr("r", 3.6).attr("fill", c).attr("stroke", "#fff").attr("stroke-width", 1.5));

  // gap brackets at both ends
  const bracket = (yr, dx) => {
    const d = S.find(s => s.y === yr), bx = x(yr) + dx;
    gTop.append("path").attr("fill", "none").attr("stroke", INK).attr("stroke-width", 1.2)
      .attr("d", `M${bx - 4 * Math.sign(dx)},${y(d.p90)} H${bx} V${y(d.p10)} H${bx - 4 * Math.sign(dx)}`);
    return { bx, d };
  };
  const L = bracket(1960, 9);
  block(gTop, L.bx + 8, y((L.d.p10 + L.d.p90) / 2) - 8, [[["Apart in 1960", "ann-b"]], [[`${f1(L.d.gap)} deaths`, ""]]]);
  bracket(2019, 8);
  // right-side labels
  const RX = W - A.r + 22;
  block(gTop, RX, y(s1.p90) - 40, [[["Apart in 2019", "ann-b"]], [[`${f1(s1.gap)} deaths`, ""]]]);
  block(gTop, RX, y(s1.p90) + 4, [[["90th pct. ", "lab"], [f1(s1.p90), "lab val"]]]).attr("fill", GOLD);
  block(gTop, RX, y(s1.med) - 3, [[["Median ", "lab"], [f1(s1.med), "lab val"]]]).attr("fill", INK);
  block(gTop, RX, y(s1.p10) + 13, [[["10th pct. ", "lab"], [f1(s1.p10), "lab val"]]]).attr("fill", GOLD);

  // the headline number
  block(gTop, x(1986), y(318), [
    [["The countries at the 90th and 10th percentiles", ""]],
    [["went from ", ""], [f1(s0.gap), "ann-b"], [" deaths per 1,000 births apart", ""]],
    [["to ", ""], [f1(s1.gap), "ann-b"], [", a drop of ", ""], [`${drop}%`, "ann-b"], [".", ""]],
  ]);

  // ---- panel B: every country improved
  const B = { t: A.t + A.h + 60, rowH: 22 };
  const total = D.cohort.length;
  gTop.append("text").attr("class", "ptitle").attr("x", 0).attr("y", B.t).text(`All ${total} countries lowered their child death rate`);
  gTop.append("text").attr("class", "psub").attr("x", 0).attr("y", B.t + 18).text(`Number of countries by how much their rate fell from 1960 to 2019. The typical country cut it by ${f1(D.median_change)}%.`);
  const bins = D.bins.slice().reverse();
  const bx0 = 92, bxw = d3.scaleLinear().domain([0, 45]).range([0, W - bx0 - 70]);
  bins.forEach(([lo, n], i) => {
    const yy = B.t + 34 + i * B.rowH;
    gTop.append("text").attr("class", "tick").attr("x", bx0 - 10).attr("y", yy + 12).attr("text-anchor", "end").text(`${lo}–${lo + 10}% lower`);
    g.append("rect").attr("x", bx0).attr("y", yy + 5).attr("width", bxw(n)).attr("height", B.rowH - 11).attr("rx", 1).attr("fill", GOLD);
    gTop.append("text").attr("class", "lab").attr("x", bx0 + bxw(n) + 6).attr("y", yy + 13).attr("fill", "#121212").text(n);
  });
  const H = B.t + 34 + bins.length * B.rowH + 4;
  svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);

  marker(1, x(1960) + 2, A.t + 6, GOLD);                    // fixed cohort
  marker(2, W - 10, y(s1.p90) - 2, GOLD);                  // P10/P90 trimming
  marker(3, x(1986) - 14, y(318) - 4, GOLD);                 // linear axis + absolute gap headline
  marker(4, W - 12, B.t - 4, GOLD);                          // 112/112 panel
  marker(5, bx0 + bxw(1) + 34, B.t + 34 + 4 * B.rowH + 10, GOLD);           // bins start at 50%
}

function drawAgainst(D) {
  const RED = "#b3261e", RED_FILL = "#f4d7d3", GRAY = "#9a9aa4";
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const peak = S.reduce((a, b) => (b.ratio > a.ratio ? b : a));
  const ssa = D.regions.find(r => r.region === "Sub-Saharan Africa"), eca = D.regions.find(r => r.region.startsWith("Europe"));
  const mult = s1.ratio / s0.ratio;
  d3.select("#title").text("Child survival is twice as unequal as it was in 1960");
  d3.select("#dek").text("How many times higher the death rate before age 5 is in the country at the 90th percentile than in the one at the 10th. Same 112 countries, 1960 to 2019.");
  d3.select("#src").text(`Source: World Bank Human Development Indicators, 1960 to 2020. Percentiles use the nearest rank. The regional panel includes all ${D.n_2019} countries with 2019 data and counts every country equally.`);

  // ---- panel A: the ratio over time
  const A = { t: 8, h: 230, l: 30, r: 72 };
  const x = d3.scaleLinear().domain([1960, 2019]).range([A.l, W - A.r]);
  const y = d3.scaleLinear().domain([0, 25]).range([A.t + A.h, A.t]);
  [5, 10, 15, 20, 25].forEach(v => {
    gBack.append("line").attr("class", "grid").attr("x1", 0).attr("x2", W - A.r).attr("y1", y(v)).attr("y2", y(v));
    gTop.append("text").attr("class", "tick").attr("x", 0).attr("y", y(v) - 5).text(v === 25 ? "25× as high" : `${v}×`);
  });
  g.append("line").attr("class", "base").attr("x1", 0).attr("x2", W - A.r).attr("y1", y(0)).attr("y2", y(0));
  [1960, 1970, 1980, 1990, 2000, 2010, 2019].forEach(v => gTop.append("text").attr("class", "tick").attr("x", x(v)).attr("y", y(0) + 17)
    .attr("text-anchor", v === 2019 ? "end" : "middle").text(v));
  g.append("path").datum(S).attr("fill", RED_FILL).attr("opacity", 0)
    .attr("d", d3.area().x(d => x(d.y)).y0(y(0)).y1(d => y(d.ratio)).curve(d3.curveMonotoneX));
  g.append("path").datum(S).attr("fill", "none").attr("stroke", RED).attr("stroke-width", 2.6)
    .attr("d", d3.line().x(d => x(d.y)).y(d => y(d.ratio)).curve(d3.curveMonotoneX));
  g.append("line").attr("x1", x(1960)).attr("x2", W - A.r).attr("y1", y(s0.ratio)).attr("y2", y(s0.ratio))
    .attr("stroke", "#8a8a8a").attr("stroke-width", 1).attr("stroke-dasharray", "3 3");
  gTop.append("text").attr("class", "tick").attr("x", x(1990)).attr("y", y(s0.ratio) + 15).text(`1960 level, ${f1(s0.ratio)}×`);
  [[s0, "start", 6, -9], [peak, "middle", 0, -9]].forEach(([d, anc, dx, dy]) => {
    g.append("circle").attr("cx", x(d.y)).attr("cy", y(d.ratio)).attr("r", 4).attr("fill", RED).attr("stroke", "#fff").attr("stroke-width", 1.5);
    block(gTop, x(d.y) + dx, y(d.ratio) + dy, [[[`${f1(d.ratio)}×`, "lab val"], [d === peak ? ` in ${d.y}` : "", "lab"]]], { anchor: anc }).attr("fill", RED);
  });
  g.append("circle").attr("cx", x(2019)).attr("cy", y(s1.ratio)).attr("r", 4).attr("fill", RED).attr("stroke", "#fff").attr("stroke-width", 1.5);
  block(gTop, W - A.r + 10, y(s1.ratio) - 4, [[[`${f1(s1.ratio)}×`, "lab val"]], [["in 2019", "lab"]]], { lh: 15 }).attr("fill", RED);
  block(gTop, x(1964), y(22), [
    [["In 2019, a child in the country at", ""]],
    [["the 90th percentile faced ", ""], [`${f1(s1.ratio)} times`, "ann-b"]],
    [["the risk of a child at the 10th,", ""]],
    [["about ", ""], ["twice", "ann-b"], [" the ratio in 1960.", ""]],
  ]);

  // ---- panel B: regional snapshot, 2019
  const B = { t: A.t + A.h + 62, rowH: 26, l: 172, r: 24 };
  gTop.append("text").attr("class", "ptitle").attr("x", 0).attr("y", B.t).text(`In 2019, regional medians still differed by a factor of ${Math.round(ssa.med / eca.med)}`);
  gTop.append("text").attr("class", "psub").attr("x", 0).attr("y", B.t + 18).text("Each dot is a country and the black tick marks the regional median. Deaths before age 5 per 1,000 births, 2019.");
  const bx = d3.scaleLinear().domain([0, 120]).range([B.l, W - B.r]);
  const top = B.t + 36;
  [0, 20, 40, 60, 80, 100, 120].forEach(v => {
    gBack.append("line").attr("class", "grid").attr("x1", bx(v)).attr("x2", bx(v)).attr("y1", top - 4).attr("y2", top + D.regions.length * B.rowH);
    gTop.append("text").attr("class", "tick").attr("x", bx(v)).attr("y", top + D.regions.length * B.rowH + 15).attr("text-anchor", "middle").text(v);
  });
  const jitter = d3.randomLcg(0.42);
  D.regions.forEach((r, i) => {
    const cy = top + i * B.rowH + B.rowH / 2, isSSA = r === ssa;
    gTop.append("text").attr("class", "tick").attr("x", B.l - 12).attr("y", cy + 4).attr("text-anchor", "end")
      .style("fill", isSSA ? RED : "#3b3b44").style("font-weight", isSSA ? 600 : 400).text(`${r.region} (${r.n})`);
    r.pts.forEach(p => g.append("circle").attr("cx", bx(p.v)).attr("cy", cy + (jitter() - 0.5) * 10).attr("r", 2.6)
      .attr("fill", isSSA ? RED : GRAY).attr("fill-opacity", isSSA ? 0.8 : 0.55));
    g.append("line").attr("x1", bx(r.med)).attr("x2", bx(r.med)).attr("y1", cy - 9).attr("y2", cy + 9).attr("stroke", "#141416").attr("stroke-width", 2.4);
    if (isSSA || r === eca) gTop.append("text").attr("class", "lab halo").attr("x", bx(r.med) + 6).attr("y", cy - 8)
      .attr("fill", isSSA ? RED : "#141416").text(f1(r.med));
  });
  block(gTop, bx(62), top + 2 * B.rowH + 4, [
    [["Sub-Saharan Africa’s median of ", ""], [f1(ssa.med), "ann-b"], [" is", ""]],
    [[`${f1(ssa.med / eca.med)} times`, "ann-b"], [" Europe and Central Asia’s ", ""], [f1(eca.med), "ann-b"], [".", ""]],
  ]);
  const H = top + D.regions.length * B.rowH + 22;
  svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);

  marker(1, x(1964) - 16, y(22) - 4, RED);                                       // ratio as the measure
  marker(2, x(2019) - 6, y(s1.ratio) + 26, RED);                     // same cohort
  marker(3, x(peak.y), y(peak.ratio) - 30, RED);                     // 1960 baseline vs peak
  marker(4, bx(62) - 14, top + 2 * B.rowH, RED);                     // red only for SSA + ratio callout
  marker(5, W - 12, B.t - 4, RED);                                   // snapshot for a trend, different sample
}
</script>
</body>
</html>
