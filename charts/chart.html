<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Child Mortality Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  html, body { margin: 0; background: #fff; }
  body { font-family: "Libre Franklin", "Franklin Gothic Book", Arial, sans-serif; color: #333; }
  #wrap { width: 720px; padding: 24px 24px 18px; box-sizing: border-box; }
  h1 { color: #121212; font-weight: 700; font-size: 21px; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
  .dek { font-size: 14px; line-height: 1.45; color: #555; font-weight: 500; margin: 0 0 18px; }
  .src { font-size: 11.5px; color: #777; font-weight: 500; margin-top: 12px; line-height: 1.5; }
  svg { display: block; overflow: visible; }
  svg text { font-family: inherit; }
  .tick { font-size: 12px; font-weight: 500; fill: #737373; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; font-variant-numeric: tabular-nums; }
  .grid { stroke: #ebebeb; stroke-width: 1; shape-rendering: crispEdges; }
  .base { stroke: #8f8f8f; stroke-width: 1; shape-rendering: crispEdges; }
  .country { fill: none; stroke: #000; stroke-opacity: 0.07; stroke-width: 0.8; stroke-linejoin: round; }
  .ann { font-size: 13px; font-weight: 500; fill: #222; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .ann-b { font-weight: 800; fill: #121212; }
  .lab { font-size: 12.5px; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .val { font-weight: 800; font-variant-numeric: tabular-nums; }
  .mk circle { stroke: #fff; stroke-width: 2; }
  .mk text { font-size: 11.5px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .mkh { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; margin-right: 8px; vertical-align: 2px;
         font-size: 11.5px; font-weight: 700; color: #fff; line-height: 1; }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title"></h1>
  <p class="dek" id="dek"></p>
  <svg id="chart"></svg>
  <div class="src" id="src"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const WHICH = params.get("v") || "for";
const REVEAL = params.has("reveal");
const W = 672, H = 380, M = { t: 10, r: 112, b: 26, l: 30 };
const svg = d3.select("#chart").attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
const gBack = svg.append("g"), g = svg.append("g"), gTop = svg.append("g"), gMk = svg.append("g");
const f1 = v => (Math.round(v * 10 + 1e-9) / 10).toFixed(1);   // one decimal, half up
const x = d3.scaleLinear().domain([1960, 2019]).range([M.l, W - M.r]);
const Y0 = H - M.b;

function block(sel, x, y, lines, opts = {}) {
  const t = sel.append("text").attr("x", x).attr("y", y).attr("class", opts.cls || "ann").attr("text-anchor", opts.anchor || "start");
  lines.forEach((ln, i) => {
    ln.forEach(([s, c], j) => {
      const ts = t.append("tspan").text(s);
      if (c) ts.attr("class", c);
      if (j === 0) ts.attr("x", x).attr("dy", i === 0 ? 0 : (opts.lh || 18));
    });
  });
  return t;
}
function marker(n, x, y, color) {
  if (!REVEAL) return;
  const m = gMk.append("g").attr("class", "mk").attr("transform", `translate(${x},${y})`);
  m.append("circle").attr("r", 10.5).attr("fill", color);
  m.append("text").text(n);
}
function htmlMarker(id, n, color) {
  if (!REVEAL) return;
  const el = document.createElement("span"); el.className = "mkh"; el.style.background = color; el.textContent = n;
  document.querySelector(id).prepend(el);
}
function axes(y, ticks, topLabel, fmt) {
  ticks.forEach(v => {
    gBack.append("line").attr("class", "grid").attr("x1", 0).attr("x2", W - M.r).attr("y1", y(v)).attr("y2", y(v));
    gTop.append("text").attr("class", "tick").attr("x", 0).attr("y", y(v) - 5).text(v === ticks[ticks.length - 1] ? topLabel : fmt(v));
  });
  g.append("line").attr("class", "base").attr("x1", 0).attr("x2", W - M.r).attr("y1", Y0).attr("y2", Y0);
  [1960, 1970, 1980, 1990, 2000, 2010, 2019].forEach(v => gTop.append("text").attr("class", "tick").attr("x", x(v)).attr("y", Y0 + 18)
    .attr("text-anchor", v === 2019 ? "end" : "middle").text(v));
}
const dot = (cx, cy, c) => g.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 4).attr("fill", c).attr("stroke", "#fff").attr("stroke-width", 1.5);

d3.json("data.json").then(D => (WHICH === "for" ? drawFor : drawAgainst)(D));

function drawFor(D) {
  const GOLD = "#a87b16", FILL = "#f6ecd4";
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const drop = Math.round(100 * (1 - s1.gap / s0.gap));
  d3.select("#title").text(`Countries are ${drop}% closer in child survival than in 1960`);
  d3.select("#dek").text("Deaths before age 5 per 1,000 live births in the 112 countries with data in both 1960 and 2019. Each gray line is a country, and the band spans the 10th to the 90th percentile.");
  d3.select("#src").text("Source: World Bank Human Development Indicators, 1960 to 2020. Percentiles use the nearest rank and weight every country equally.");

  const y = d3.scaleLinear().domain([0, 400]).range([Y0, M.t]);
  axes(y, [100, 200, 300, 400], "400 deaths per 1,000 births", String);
  g.append("path").datum(S).attr("fill", FILL)
    .attr("d", d3.area().x(d => x(d.y)).y0(d => y(d.p10)).y1(d => y(d.p90)).curve(d3.curveMonotoneX));
  const line = d3.line().x(d => x(d[0])).y(d => y(d[1])).curve(d3.curveMonotoneX);
  g.append("g").selectAll("path").data(D.cohort).join("path").attr("class", "country").attr("d", c => line(c.v));
  ["p10", "p90"].forEach(k => g.append("path").datum(S).attr("fill", "none").attr("stroke", GOLD).attr("stroke-width", 2.4)
    .attr("d", d3.line().x(d => x(d.y)).y(d => y(d[k])).curve(d3.curveMonotoneX)));
  [s0, s1].forEach(s => { dot(x(s.y), y(s.p90), GOLD); dot(x(s.y), y(s.p10), GOLD); });

  // distance brackets at both ends
  const bracket = (s, dx) => {
    const bx = x(s.y) + dx, t = 4 * Math.sign(dx);
    gTop.append("path").attr("fill", "none").attr("stroke", "#121212").attr("stroke-width", 1.2)
      .attr("d", `M${bx - t},${y(s.p90)} H${bx} V${y(s.p10)} H${bx - t}`);
    return bx;
  };
  const bl = bracket(s0, 10);
  block(gTop, bl + 9, y((s0.p10 + s0.p90) / 2) - 6, [[[f1(s0.gap), "ann-b"]], [["deaths apart", ""]]]);
  bracket(s1, 10);
  const RX = W - M.r + 24;
  block(gTop, RX, y(s1.p90) - 30, [[[f1(s1.gap), "ann-b"]], [["deaths apart", ""]]]);
  block(gTop, x(s0.y) + 8, y(s0.p90) - 10, [[["90th percentile ", "lab"], [f1(s0.p90), "lab val"]]]).attr("fill", GOLD);
  block(gTop, RX, y(s1.p90) + 14, [[["90th pct. ", "lab"], [f1(s1.p90), "lab val"]]]).attr("fill", GOLD);
  block(gTop, RX, y(s1.p10) + 4, [[["10th pct. ", "lab"], [f1(s1.p10), "lab val"]]]).attr("fill", GOLD);

  block(gTop, x(1984), y(330), [
    [["The countries at the 90th and 10th percentiles", ""]],
    [["were ", ""], [f1(s0.gap), "ann-b"], [" deaths per 1,000 births apart in 1960", ""]],
    [["and ", ""], [f1(s1.gap), "ann-b"], [" apart in 2019.", ""]],
  ]);

  htmlMarker("#title", 4, GOLD);                                   // headline wording
  htmlMarker("#dek", 1, GOLD);                                     // fixed cohort
  marker(2, 212, y(s0.p90) - 14, GOLD);                  // percentiles
  marker(3, 196, y(400) - 9, GOLD);                                // linear scale of raw rates
  marker(5, x(1996), y(262), GOLD);                                // every country shown
}

function drawAgainst(D) {
  const RED = "#b3261e";
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const peak = S.reduce((a, b) => (b.ratio > a.ratio ? b : a));
  d3.select("#title").text("Child survival is twice as unequal as it was in 1960");
  d3.select("#dek").text("How many times higher the death rate before age 5 is in the country at the 90th percentile than in the country at the 10th, among the 112 countries with data in both 1960 and 2019.");
  d3.select("#src").text("Source: World Bank Human Development Indicators, 1960 to 2020. Percentiles use the nearest rank and weight every country equally.");

  const y = d3.scaleLinear().domain([0, 25]).range([Y0, M.t]);
  axes(y, [5, 10, 15, 20, 25], "25 times as high", v => `${v}×`);
  g.append("line").attr("x1", x(1960)).attr("x2", W - M.r).attr("y1", y(s0.ratio)).attr("y2", y(s0.ratio))
    .attr("stroke", "#8a8a8a").attr("stroke-width", 1).attr("stroke-dasharray", "3 3");
  gTop.append("text").attr("class", "tick").attr("x", x(1990)).attr("y", y(s0.ratio) + 16).text(`1960 level, ${f1(s0.ratio)}×`);
  g.append("path").datum(S).attr("fill", "none").attr("stroke", RED).attr("stroke-width", 2.6)
    .attr("d", d3.line().x(d => x(d.y)).y(d => y(d.ratio)).curve(d3.curveMonotoneX));
  [s0, peak, s1].forEach(d => dot(x(d.y), y(d.ratio), RED));
  block(gTop, x(s0.y) + 8, y(s0.ratio) - 10, [[[`${f1(s0.ratio)}×`, "lab val"]]]).attr("fill", RED);
  block(gTop, x(peak.y), y(peak.ratio) - 12, [[[`${f1(peak.ratio)}×`, "lab val"], [` in ${peak.y}`, "lab"]]], { anchor: "middle" }).attr("fill", RED);
  block(gTop, W - M.r + 12, y(s1.ratio) - 2, [[[`${f1(s1.ratio)}×`, "lab val"]], [["in 2019", "lab"]]], { lh: 16 }).attr("fill", RED);

  block(gTop, x(1964), y(22), [
    [["In 2019, a child in the country at the", ""]],
    [["90th percentile was ", ""], [`${f1(s1.ratio)} times`, "ann-b"], [" as likely", ""]],
    [["to die before age 5 as a child in the", ""]],
    [["country at the 10th percentile.", ""]],
  ]);

  htmlMarker("#title", 1, RED);                                    // ratio framed as "unequal"
  htmlMarker("#dek", 2, RED);                                      // same cohort and percentiles
  marker(3, x(1990) - 16, y(s0.ratio) + 12, RED);                  // 1960 baseline
  marker(4, x(1993), y(19.5) + 20, RED);                           // red line
  marker(5, x(1964) - 16, y(22) - 5, RED);                         // "times as likely" annotation
}
</script>
</body>
</html>
