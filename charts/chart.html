<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Child Mortality Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root { --ink: #121212; --mid: #666; --soft: #8c8c8c; --rule: #ececec;
          --teal: #6c85b9; --teal-2: #d0daed; --teal-fill: #e8edf6;
          --orange: #5f9daf; --orange-2: #bbd5de; }
  html, body { margin: 0; background: #fff; }
  body { font-family: "Libre Franklin", "Franklin Gothic Book", Arial, sans-serif; color: #333; }
  #wrap { width: 720px; padding: 26px 24px 20px; box-sizing: border-box; }
  body.embed #wrap { width: 100%; padding: 0; }
  body.embed svg { width: 100%; height: auto; }
  body.embed #wrap { padding: 14px 16px 0; }
  h1 { color: var(--ink); font-weight: 700; font-size: 21px; line-height: 1.25; margin: 0 0 5px; text-wrap: balance; }
  .dek { font-size: 14px; line-height: 1.45; color: var(--mid); font-weight: 500; margin: 0 0 16px; }
  .src { font-size: 11px; color: #999; font-weight: 500; margin-top: 18px; }
  svg { display: block; overflow: visible; }
  svg text { font-family: inherit; }
  .tick { font-size: 12px; font-weight: 500; fill: var(--soft); font-variant-numeric: tabular-nums; }
  .axis-title { font-size: 12px; font-weight: 500; fill: var(--mid); }
  .halo { paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .grid { stroke: var(--rule); stroke-width: 1; shape-rendering: crispEdges; }
  .base { stroke: #9a9a9a; stroke-width: 1; shape-rendering: crispEdges; }
  .country { fill: none; stroke: #000; stroke-opacity: 0.06; stroke-width: 0.8; }
  .lab { font-size: 13px; font-weight: 700; }
  .big { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sub { font-size: 12px; font-weight: 500; fill: var(--mid); }
  .row { font-size: 15px; font-weight: 800; fill: var(--ink); }
  svg > g { transition: opacity .35s; }
  .mk circle { stroke: #fff; stroke-width: 2; }
  .mk text { font-size: 11.5px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
  .mkh { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; margin-right: 8px; vertical-align: 2px;
         font-size: 11.5px; font-weight: 700; color: #fff; line-height: 1; }
  .ctrl { display: inline-flex; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; margin: 0 0 14px; }
  .ctrl button { font: 600 13px "Libre Franklin", Arial, sans-serif; border: 0; background: #fff; color: #444; padding: 7px 14px; cursor: pointer; }
  .ctrl button + button { border-left: 1px solid #ccc; }
  .ctrl button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .explore-ctrl { display: flex; align-items: center; gap: 14px; margin: 0 0 6px; }
  .explore-ctrl .ctrl { margin: 0; }
  .play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: #121212; color: #fff; font-size: 14px; cursor: pointer; flex: none; }
  .play:hover { background: #333; }
  .play.replay { font-size: 20px; line-height: 1; }
  .explore-ctrl input[type=range] { flex: 1; min-width: 140px; accent-color: #121212; }
  .explore-ctrl { flex-wrap: wrap; }
  body.embed svg.fixed { width: auto; height: auto; }
  @media (max-width: 520px) { .year-big { font-size: 28px; } .readout { font-size: 24px; } }
  .year-big { font-size: 34px; font-weight: 800; fill: #121212; font-variant-numeric: tabular-nums; }
  .readout { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid #ddd; border-radius: 4px; padding: 6px 9px;
         font-size: 12.5px; line-height: 1.35; box-shadow: 0 2px 6px rgba(0,0,0,.08); opacity: 0; transition: opacity .1s; }
  #tip b { display: block; color: var(--ink); }
</style>
</head>
<body>
<div id="wrap">
  <div id="ctrl"></div>
  <h1 id="title"></h1>
  <p class="dek" id="dek"></p>
  <svg id="chart"></svg>
  <div class="src" id="src">Source: World Bank Human Development Indicators. The 112 countries with data in both 1960 and 2019.</div>
</div>
<div id="tip"></div>
<script>
const P = new URLSearchParams(location.search);
const VIEW = P.get("v") || "for1";
const REVEAL = P.has("reveal");
if (P.has("embed")) document.body.classList.add("embed");
const C = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const TEAL = C("--teal"), TEAL2 = C("--teal-2"), TFILL = C("--teal-fill"), ORANGE = C("--orange"), ORANGE2 = C("--orange-2");
const W = 672;
const svg = d3.select("#chart").attr("width", W);
const gBack = svg.append("g"), g = svg.append("g"), gTop = svg.append("g"), gMk = svg.append("g");
const f1 = v => (Math.round(v * 10 + 1e-9) / 10).toFixed(1);
const f0 = v => String(Math.round(v));
const text = (sel, x, y, s, cls, fill, anchor = "start") =>
  sel.append("text").attr("x", x).attr("y", y).attr("class", cls).attr("fill", fill || null).attr("text-anchor", anchor).text(s);
const dot = (cx, cy, c, r = 4.2) => g.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r).attr("fill", c).attr("stroke", "#fff").attr("stroke-width", 1.6);
function marker(n, x, y, color) {
  if (!REVEAL) return;
  const m = gMk.append("g").attr("class", "mk").attr("transform", `translate(${x},${y})`);
  m.append("circle").attr("r", 10.5).attr("fill", color);
  m.append("text").text(n);
}
function htmlMarker(id, n, color) {
  if (!REVEAL) return;
  const el = document.createElement("span"); el.className = "mkh"; el.style.background = color; el.textContent = n;
  document.querySelector(id).prepend(el);
}

d3.json("data.json").then(D => {
  ({ for1, for2, against1, against2, morph, sens, explore })[VIEW](D);
  if (P.has("dump")) {   // marker centers, for the page's click targets
    const pts = [...document.querySelectorAll(".mk, .mkh")].map(el => {
      const r = el.getBoundingClientRect(), n = +el.textContent;
      return { n, x: Math.round(r.left + r.width / 2), y: Math.round(r.top + r.height / 2 + scrollY) };
    });
    const pre = document.createElement("pre"); pre.id = "dump"; pre.textContent = JSON.stringify(pts); document.body.append(pre);
  }
});

/* ---------- time series frame shared by for1 / against1 ---------- */
function timeFrame(H, yMax, ticks, fmt, yLabel, right, left = 70, yTitleX = 12) {
  const M = { t: 18, r: right, b: 52, l: left };
  svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
  const x = d3.scaleLinear().domain([1960, 2019]).range([M.l, W - M.r]);
  const y = d3.scaleLinear().domain([0, yMax]).range([H - M.b, M.t]);
  svg.append("defs").append("clipPath").attr("id", "plot").append("rect").attr("x", 0).attr("y", M.t - 4).attr("width", W).attr("height", H - M.t - M.b + 4);
  const yAxis = gTop.append("g").attr("class", "y-axis").attr("aria-label", yLabel);
  yAxis.append("line").attr("class", "base").attr("x1", M.l).attr("x2", M.l).attr("y1", y(0)).attr("y2", y(yMax));
  text(yAxis, 0, 0, yLabel, "axis-title", null, "middle")
    .attr("transform", `translate(${yTitleX},${(M.t + H - M.b) / 2}) rotate(-90)`);
  [0, ...ticks].forEach(v => {
    gBack.append("line").attr("class", "grid").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(v)).attr("y2", y(v));
    yAxis.append("line").attr("class", "base").attr("x1", M.l - 5).attr("x2", M.l).attr("y1", y(v)).attr("y2", y(v));
    text(yAxis, M.l - 10, y(v) + 4, fmt(v), "tick", null, "end");
  });
  g.append("line").attr("class", "base").attr("x1", M.l).attr("x2", W - M.r).attr("y1", y(0)).attr("y2", y(0));
  [1960, 1970, 1980, 1990, 2000, 2010, 2019].forEach(v => text(gTop, x(v), H - M.b + 19, v, "tick", null, v === 2019 ? "end" : "middle"));
  text(gTop, (M.l + W - M.r) / 2, H - 6, "Year", "axis-title", null, "middle");
  return { x, y, M };
}

function for1(D) {   // percentile fan chart
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const drop = Math.round(100 * (1 - s1.gap / s0.gap));
  d3.select("#title").text(`Countries have moved ${drop}% closer together since 1960`);
  d3.select("#dek").text("Distribution of deaths before age 5 per 1,000 live births across 112 countries, 1960 to 2019.");
  const { x, y } = timeFrame(390, 300, [100, 200, 300], String, "Deaths before age 5 per 1,000 live births", 102, 144, 34);
  const area = (a, b) => d3.area().x(d => x(d.y)).y0(d => y(d[a])).y1(d => y(d[b])).curve(d3.curveMonotoneX);
  const line = k => d3.line().x(d => x(d.y)).y(d => y(d[k])).curve(d3.curveMonotoneX);
  g.append("path").datum(S).attr("fill", "#e8edf6").attr("d", area("p10", "p90"));
  g.append("path").datum(S).attr("fill", "#cdd7ec").attr("d", area("p25", "p75"));
  ["p10", "p90"].forEach(k => g.append("path").datum(S).attr("fill", "none").attr("stroke", TEAL).attr("stroke-width", 1.2).attr("opacity", 0.8).attr("d", line(k)));
  g.append("path").datum(S).attr("fill", "none").attr("stroke", "#4b6693").attr("stroke-width", 2.6).attr("d", line("med"));

  // inline band labels where the fan is widest
  const at = S.find(s => s.y === 1972);
  text(gTop, x(1972), y((at.p75 + at.p90) / 2) + 4, "Middle 80% of countries", "lab halo", TEAL, "middle");
  text(gTop, x(1972), y((at.med + at.p75) / 2) + 4, "Middle 50%", "lab halo", "#4b6693", "middle");
  text(gTop, x(1982), y(S.find(s => s.y === 1982).med) - 9, "Median", "lab halo", "#4b6693", "middle");

  // Keep both endpoint brackets; the wider left margin separates the 1960 label from the axis and fan.
  const bracket = (s, bx, dir, year) => {
    gTop.append("path").attr("class", "gap-bracket").attr("data-year", year)
      .attr("fill", "none").attr("stroke", "#42484b").attr("stroke-width", 1.2)
      .attr("d", `M${bx - (dir < 0 ? 38 : 6) * dir},${y(s.p90)} H${bx} V${y(s.p10)} H${bx - (dir < 0 ? 38 : 6) * dir}`);
  };
  bracket(s0, x(1960) - 44, -1, 1960);
  text(gTop, x(1960) - 54, y((s0.p10 + s0.p90) / 2) - 2, f0(s0.gap), "big halo", "#303b40", "end");
  text(gTop, x(1960) - 54, y((s0.p10 + s0.p90) / 2) + 15, "apart", "sub halo", null, "end");
  bracket(s1, x(2019) + 10, 1, 2019);
  text(gTop, x(2019) + 20, y((s1.p10 + s1.p90) / 2) + 6, f0(s1.gap), "big halo", "#303b40");
  text(gTop, x(2019) + 20, y((s1.p10 + s1.p90) / 2) + 23, "apart", "sub halo");

  marker(1, x(1972), y((at.p75 + at.p90) / 2) - 24, TEAL);   // percentiles of a fixed sample
  marker(2, x(1960) - 16, y(250), TEAL);                          // linear scale
  htmlMarker("#title", 3, TEAL);                              // "closer" without naming the measure
}

function against1(D) {   // ratio with bootstrap ensemble
  const S = D.stats, s0 = S[0], s1 = S[S.length - 1];
  const peak = S.reduce((a, b) => (b.ratio > a.ratio ? b : a));
  const CI = Object.fromEntries(D.boot_ci.map(c => [c.y, c]));
  d3.select("#title").text("Child mortality is twice as unequal as it was in 1960");
  d3.select("#dek").text("Death rate before age 5 in the 90th percentile country as a multiple of the 10th. Faint lines are 200 bootstrap resamples of the 112 countries.");
  const { x, y } = timeFrame(380, 30, [10, 20, 30], v => `${v}×`, "Mortality rate ratio (90th ÷ 10th percentile)", 96);
  const yrs = d3.range(1960, 2020);
  const bl = d3.line().x((d, i) => x(yrs[i])).y(d => y(Math.min(d, 30))).curve(d3.curveMonotoneX);
  g.append("g").selectAll("path").data(D.boot_lines).join("path").attr("fill", "none")
    .attr("stroke", ORANGE).attr("stroke-opacity", 0.07).attr("stroke-width", 1).attr("d", bl);
  g.append("line").attr("x1", x(1960)).attr("x2", x(2019)).attr("y1", y(s0.ratio)).attr("y2", y(s0.ratio))
    .attr("stroke", "#121212").attr("stroke-width", 1).attr("stroke-dasharray", "3 3").attr("opacity", 0.45);
  g.append("path").datum(S).attr("fill", "none").attr("stroke", ORANGE).attr("stroke-width", 3.2)
    .attr("d", d3.line().x(d => x(d.y)).y(d => y(d.ratio)).curve(d3.curveMonotoneX));
  [s0, peak, s1].forEach(d => dot(x(d.y), y(d.ratio), ORANGE, 4.8));
  text(gTop, x(s0.y) + 10, y(s0.ratio) - 12, `${f1(s0.ratio)}×`, "lab halo", ORANGE);
  text(gTop, x(peak.y), y(peak.ratio) - 14, `${f1(peak.ratio)}× in ${peak.y}`, "lab halo", ORANGE, "middle");

  // 95% interval at the end, as an error bar
  const ex = x(2019) + 14, c1 = CI[2019];
  gTop.append("path").attr("fill", "none").attr("stroke", "#121212").attr("stroke-width", 1.2)
    .attr("d", `M${ex - 4},${y(c1.hi)} H${ex + 4} M${ex},${y(c1.hi)} V${y(c1.lo)} M${ex - 4},${y(c1.lo)} H${ex + 4}`);
  text(gTop, ex + 12, y(s1.ratio) + 7, `${f1(s1.ratio)}×`, "big halo", ORANGE);
  text(gTop, ex + 12, y(s1.ratio) + 24, `95% interval`, "sub halo");
  text(gTop, ex + 12, y(s1.ratio) + 39, `${f0(c1.lo)} to ${f0(c1.hi)}`, "sub halo");
  text(gTop, x(1990), y(s0.ratio) + 17, "1960 level", "sub halo", null, "middle");

  htmlMarker("#title", 1, ORANGE);                     // ratio described as inequality
  marker(2, x(1990) - 46, y(s0.ratio) + 12, ORANGE);   // 1960 baseline
  marker(3, x(1975), y(25), ORANGE);                   // bootstrap lines lend authority, same sample
}

/* ---------- sensitivity: each published chart beside one reversed choice ---------- */
function sens(D) {
  d3.select("#title").text("Reverse one choice and the verdict flips");
  d3.select("#dek").text("Figures 1 and 3 as published (left) and with a single design choice reversed (right). Same countries, same percentiles.");
  const S = D.stats, by = Object.fromEntries(S.map(s => [s.y, s]));
  const PW = 312, GAP = 48, PH = 170, HEAD = 64, ROWGAP = 40;
  const H = 2 * (HEAD + PH + 26) + ROWGAP;
  svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
  const panels = [
    { col: 0, row: 0, kind: "band", scale: "linear", start: 1960, label: "Figure 1 as published" },
    { col: 1, row: 0, kind: "band", scale: "log", start: 1960, label: "Reversed: logarithmic scale" },
    { col: 0, row: 1, kind: "ratio", start: 1960, label: "Figure 3 as published" },
    { col: 1, row: 1, kind: "ratio", start: 1999, label: "Reversed: measured from 1999" },
  ];
  panels.forEach(p => {
    const ox = p.col * (PW + GAP), oy = p.row * (HEAD + PH + 26 + ROWGAP);
    const pg = svg.append("g").attr("transform", `translate(${ox},${oy})`);
    const ser = S.filter(s => s.y >= p.start), a = ser[0], b = ser[ser.length - 1];
    // verdict, computed from the data the panel shows
    let head, closer;
    if (p.kind === "band" && p.scale === "linear") { const c = 1 - b.gap / a.gap; closer = c > 0; head = `${Math.round(c * 100)}% closer since ${p.start}`; }
    else { const m = b.ratio / a.ratio; closer = m < 1; head = closer ? `${Math.round((1 - m) * 100)}% closer since ${p.start}` : (Math.abs(m - 2) < 0.15 ? "Twice as far apart as in 1960" : `${f1(m)} times as far apart`); }
    const col = closer ? TEAL : ORANGE;
    text(pg, 0, 14, p.label.toUpperCase(), "tick").style("font-weight", 700).style("letter-spacing", ".05em").style("font-size", "11px");
    text(pg, 0, 38, head, "lab", col).style("font-size", "17px").style("font-weight", 800);
    text(pg, 0, 56, closer ? "Supports the proposition" : "Opposes the proposition", "sub", col).style("font-weight", 600);

    const top = HEAD + 22, bot = HEAD + PH + 10;
    const x = d3.scaleLinear().domain([p.start, 2019]).range([30, PW - 40]);
    let y, ticks, fmt;
    if (p.kind === "band" && p.scale === "linear") { y = d3.scaleLinear().domain([0, 300]).range([bot, top]); ticks = [100, 200, 300]; fmt = String; }
    else if (p.kind === "band") { y = d3.scaleLog().domain([2, 400]).range([bot, top]); ticks = [3, 10, 30, 100, 300]; fmt = String; }
    else { y = d3.scaleLinear().domain([0, 25]).range([bot, top]); ticks = [10, 20]; fmt = v => `${v}×`; }
    ticks.forEach(t => {
      pg.append("line").attr("class", "grid").attr("x1", 0).attr("x2", PW - 40).attr("y1", y(t)).attr("y2", y(t));
      text(pg, 0, y(t) - 4, fmt(t), "tick halo").style("font-size", "11px");
    });
    pg.append("line").attr("class", "base").attr("x1", 0).attr("x2", PW - 40).attr("y1", bot).attr("y2", bot);
    [p.start, 2019].forEach(v => text(pg, x(v), bot + 16, v, "tick", null, v === 2019 ? "end" : "middle").style("font-size", "11px"));
    const dotp = (cx, cy) => pg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 3.6).attr("fill", col).attr("stroke", "#fff").attr("stroke-width", 1.4);
    if (p.kind === "band") {
      pg.append("path").datum(ser).attr("fill", col).attr("opacity", 0.18)
        .attr("d", d3.area().x(d => x(d.y)).y0(d => y(d.p10)).y1(d => y(d.p90)).curve(d3.curveMonotoneX));
      ["p10", "p90"].forEach(k => pg.append("path").datum(ser).attr("fill", "none").attr("stroke", col).attr("stroke-width", 2)
        .attr("d", d3.line().x(d => x(d.y)).y(d => y(d[k])).curve(d3.curveMonotoneX)));
      [a, b].forEach(s => { dotp(x(s.y), y(s.p90)); dotp(x(s.y), y(s.p10)); });
      const lab = s => (p.scale === "linear" ? f0(s.gap) : `${f1(s.ratio)}×`);
      text(pg, x(b.y) + 8, (y(b.p90) + y(b.p10)) / 2 + 5, lab(b), "lab halo", col).style("font-size", "15px");
      text(pg, x(a.y) + 6, (y(a.p90) + y(a.p10)) / 2 + 5, lab(a), "lab halo", "#121212").style("font-size", "13px");
    } else {
      pg.append("path").datum(ser).attr("fill", "none").attr("stroke", col).attr("stroke-width", 2.6)
        .attr("d", d3.line().x(d => x(d.y)).y(d => y(d.ratio)).curve(d3.curveMonotoneX));
      pg.append("line").attr("x1", x(a.y)).attr("x2", x(2019)).attr("y1", y(a.ratio)).attr("y2", y(a.ratio))
        .attr("stroke", "#121212").attr("stroke-dasharray", "3 3").attr("opacity", 0.4);
      dotp(x(a.y), y(a.ratio)); dotp(x(b.y), y(b.ratio));
      text(pg, x(a.y) + (p.start === 1960 ? 6 : 0), y(a.ratio) - 9, `${f1(a.ratio)}×`, "lab halo", "#121212", p.start === 1960 ? "start" : "middle").style("font-size", "13px");
      text(pg, x(b.y) + 8, y(b.ratio) + 5, `${f1(b.ratio)}×`, "lab halo", col).style("font-size", "15px");
    }
  });
  // divider between the published and reversed columns
  svg.append("line").attr("x1", PW + GAP / 2 - 6).attr("x2", PW + GAP / 2 - 6).attr("y1", 0).attr("y2", H - 10).attr("stroke", "#e4e4e4");
}

/* ---------- explorer: animated distribution, 1960 to 2019 ---------- */
function explore(D) {
  ["#title", "#dek", "#src"].forEach(s => d3.select(s).remove());
  // lay out for the real width of the frame, so text stays readable on phones
  const W = P.has("embed") ? Math.max(300, Math.min(672, document.getElementById("wrap").clientWidth - 32)) : 672;
  const narrow = W < 520;
  const YEARS = d3.range(1960, 2020), R = narrow ? 3 : 4.4, ROWY = narrow ? 135 : 150, HB = narrow ? 64 : 58;
  const RY = narrow ? 268 : 296, RW = narrow ? W : 300, RH = narrow ? 48 : 60, RSTEP = narrow ? 168 : 0;
  const H = narrow ? RY + 2 * RSTEP - 6 : 470;
  svg.attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`).style("width", W + "px").style("height", H + "px");
  const S = Object.fromEntries(D.stats.map(s => [s.y, s]));
  const lin = d3.scaleLinear().domain([0, 400]).range([20, W - 20]);
  const log = d3.scaleLog().domain([1.5, 450]).range([20, W - 20]);
  const countries = D.cohort.map(c => ({ name: c.name, v: Object.fromEntries(c.v) }));

  // collision layout per (scale, year), computed on first use and cached; each year starts from the
  // previous year's vertical positions so dots glide instead of jumping
  const cache = { linear: {}, log: {} };
  function getLayout(m, yr) {
    if (cache[m][yr]) return cache[m][yr];
    const sc = m === "log" ? log : lin, prev = cache[m][yr - 1];
    const nodes = countries.filter(c => c.v[yr] != null).map(c => {
      const p = prev && prev.get(c.name);
      return { name: c.name, val: c.v[yr], x: sc(c.v[yr]), y: p ? p.y : ROWY };
    });
    d3.forceSimulation(nodes).force("x", d3.forceX(d => sc(d.val)).strength(1)).force("y", d3.forceY(ROWY).strength(0.07))
      .force("c", d3.forceCollide(R + 0.6)).stop().tick(prev ? 40 : 120);
    return (cache[m][yr] = new Map(nodes.map(n => [n.name, n])));
  }
  const state = { year: 1960, mode: "linear", playing: false, timer: null };

  // ---- controls
  const ctrl = d3.select("#ctrl").attr("class", "explore-ctrl");
  const play = ctrl.append("button").attr("class", "play").attr("aria-label", "Play").html("&#9654;");
  const slider = ctrl.append("input").attr("type", "range").attr("min", 1960).attr("max", 2019).attr("step", 1).attr("value", 1960)
    .attr("aria-label", "Year");
  const seg = ctrl.append("div").attr("class", "ctrl");
  [["linear", "Linear"], ["log", "Logarithmic"]].forEach(([m, lab]) =>
    seg.append("button").attr("aria-pressed", m === state.mode).text(lab).on("click", function () {
      state.mode = m; seg.selectAll("button").attr("aria-pressed", false); d3.select(this).attr("aria-pressed", true); render(700);
    }));

  // ---- year label, axis, band
  const yearLab = gBack.append("text").attr("x", 0).attr("y", narrow ? 36 : 46).attr("class", "year-big").text(1960);
  const axisG = gBack.append("g");
  const band = g.append("rect").attr("y", ROWY - HB).attr("height", 2 * HB).attr("fill", "#121212").attr("opacity", 0.045).attr("rx", 4);
  const p10l = g.append("line").attr("y1", ROWY - HB - 2).attr("y2", ROWY + HB + 2).attr("stroke", "#121212").attr("stroke-width", 1.2).attr("stroke-dasharray", "3 3");
  const p90l = g.append("line").attr("y1", ROWY - HB - 2).attr("y2", ROWY + HB + 2).attr("stroke", "#121212").attr("stroke-width", 1.2).attr("stroke-dasharray", "3 3");
  const p10t = gTop.append("text").attr("class", "sub halo").attr("text-anchor", "middle").attr("y", ROWY - HB - 8).text("10th");
  const p90t = gTop.append("text").attr("class", "sub halo").attr("text-anchor", "middle").attr("y", ROWY - HB - 8).text(narrow ? "90th" : "90th percentile");
  const dotsG = g.append("g");
  const tip = d3.select("#tip");

  function drawAxis() {
    axisG.selectAll("*").remove();
    const sc = state.mode === "log" ? log : lin;
    const ticks = state.mode === "log" ? (narrow ? [2, 10, 50, 200] : [2, 5, 10, 20, 50, 100, 200, 400])
                                       : (narrow ? [0, 100, 200, 300, 400] : [0, 50, 100, 150, 200, 250, 300, 350, 400]);
    ticks.forEach(t => {
      axisG.append("line").attr("class", "grid").attr("x1", sc(t)).attr("x2", sc(t)).attr("y1", ROWY - HB - 16).attr("y2", ROWY + HB + 12);
      text(axisG, sc(t), ROWY + HB + 30, t, "tick", null, "middle");
    });
    const unit = narrow ? "Deaths per 1,000 births" : "Deaths before age 5 per 1,000 births";
    text(axisG, W / 2, ROWY + HB + 48, state.mode === "log" ? unit + (narrow ? ", log scale" : ", logarithmic scale") : unit, "axis-title", null, "middle");
  }

  // ---- readouts: difference and ratio with sparklines (side by side, or stacked on phones)
  const readout = (ox, key, label, color, fmt, yMax) => {
    const rg = gTop.append("g").attr("transform", narrow ? `translate(0,${RY + ox})` : `translate(${ox},${RY})`);
    text(rg, 0, 0, label.toUpperCase(), "tick").style("font-weight", 700).style("letter-spacing", ".05em").style("font-size", "11px");
    const val = text(rg, 0, 34, "", "readout", color);
    const sx = d3.scaleLinear().domain([1960, 2019]).range([0, RW]);
    const sy = d3.scaleLinear().domain([0, yMax]).range([RH + 76, 80]);
    rg.append("line").attr("x1", 0).attr("x2", RW).attr("y1", sy(0)).attr("y2", sy(0)).attr("stroke", "#d0d0d0");
    rg.append("path").datum(YEARS).attr("fill", "none").attr("stroke", color).attr("stroke-opacity", 0.25).attr("stroke-width", 2)
      .attr("d", d3.line().x(y => sx(y)).y(y => sy(S[y][key])).curve(d3.curveMonotoneX));
    const done = rg.append("path").attr("fill", "none").attr("stroke", color).attr("stroke-width", 2.4);
    const cur = rg.append("circle").attr("r", 4.5).attr("fill", color).attr("stroke", "#fff").attr("stroke-width", 1.5);
    text(rg, 0, RH + 92, "1960", "tick").style("font-size", "11px");
    text(rg, RW, RH + 92, "2019", "tick", null, "end").style("font-size", "11px");
    const ch = text(rg, 0, 56, "", "sub");
    return yr => {
      val.text(fmt(S[yr][key]));
      const c = S[yr][key] / S[1960][key] - 1;
      ch.text(yr === 1960 ? "1960 baseline" : `${c > 0 ? "+" : "−"}${Math.round(Math.abs(c) * 100)}% since 1960`);
      done.attr("d", d3.line().x(y => sx(y)).y(y => sy(S[y][key])).curve(d3.curveMonotoneX)(YEARS.filter(y => y <= yr)));
      cur.attr("cx", sx(yr)).attr("cy", sy(S[yr][key]));
    };
  };
  const upGap = readout(0, "gap", "Difference, 90th − 10th", TEAL, v => `${f0(v)} deaths`, 280);
  const upRatio = readout(narrow ? RSTEP : W / 2 + 10, "ratio", "Ratio, 90th ÷ 10th", ORANGE, v => `${f1(v)}×`, 25);

  function render(dur) {
    const sc = state.mode === "log" ? log : lin, L = getLayout(state.mode, state.year), s = S[state.year];
    yearLab.text(state.year);
    slider.property("value", state.year);
    drawAxis();
    const data = [...L.values()];
    dotsG.selectAll("circle").data(data, d => d.name).join(
      enter => enter.append("circle").attr("r", R).attr("cx", d => d.x).attr("cy", d => d.y).attr("fill", "#7d8792").attr("fill-opacity", 0.78)
        .attr("stroke", "#fff").attr("stroke-width", 0.8)
        .on("mousemove", (e, d) => {
          const v = countries.find(c => c.name === d.name).v[state.year];
          tip.style("opacity", 1).style("left", e.clientX + 12 + "px").style("top", e.clientY - 10 + "px")
            .html(`<b>${d.name}</b>${state.year}: ${f1(v)} deaths per 1,000 births`);
        })
        .on("mouseleave", () => tip.style("opacity", 0)),
      update => update, exit => exit.remove())
      .transition().duration(dur).ease(d3.easeCubicInOut).attr("cx", d => d.x).attr("cy", d => d.y);
    const x10 = sc(s.p10), x90 = sc(s.p90);
    band.transition().duration(dur).attr("x", x10).attr("width", x90 - x10);
    p10l.transition().duration(dur).attr("x1", x10).attr("x2", x10);
    p90l.transition().duration(dur).attr("x1", x90).attr("x2", x90);
    p10t.transition().duration(dur).attr("x", x10);
    p90t.transition().duration(dur).attr("x", x90);
    upGap(state.year); upRatio(state.year);
  }

  const ICON = { play: "&#9654;", pause: "&#10074;&#10074;", replay: "&#8635;" };
  function setIcon(k) { play.html(ICON[k]).attr("aria-label", k[0].toUpperCase() + k.slice(1)).classed("replay", k === "replay"); }
  function stop() { state.playing = false; clearInterval(state.timer); setIcon(state.year === 2019 ? "replay" : "play"); }
  play.on("click", () => {
    if (state.playing) return stop();
    if (state.year === 2019) { state.year = 1960; render(400); }
    state.playing = true; setIcon("pause");
    state.timer = setInterval(() => {
      if (state.year >= 2019) return stop();
      state.year += 1; render(200);
      if (state.year === 2019) stop();
    }, 230);
  });
  slider.on("input", function () { state.year = +this.value; stop(); render(150); });
  render(0);
  const report = () => parent !== window && parent.postMessage({ chartHeight: document.documentElement.scrollHeight }, "*");
  report(); setTimeout(report, 300);
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - lastW) > 30) location.reload(); });
  if (P.has("autoyear")) { state.year = +P.get("autoyear"); render(0); }
  if (P.has("autolog")) { seg.selectAll("button").nodes()[1].click(); }
}

/* ---------- beeswarm: 1960 vs 2019, linear or log ---------- */
function swarm(D, mode, opts = {}) {
  const H = 410, M = { l: 96, r: 20 }, rows = { 1960: 96, 2019: 262 }, R = 2.8;
  svg.attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);
  const lin = d3.scaleLinear().domain([0, 400]).range([M.l, W - M.r]);
  const log = d3.scaleLog().domain([1.5, 450]).range([M.l, W - M.r]);
  const pts = [];
  D.cohort.forEach(c => {
    const v = Object.fromEntries(c.v);
    [1960, 2019].forEach(yr => pts.push({ name: c.name, yr, val: v[yr], v60: v[1960], v19: v[2019] }));
  });
  const layout = sc => {
    const nodes = pts.map(p => ({ ...p, x: sc(p.val), fx: sc(p.val), y: rows[p.yr] }));
    d3.forceSimulation(nodes).force("x", d3.forceX(d => sc(d.val)).strength(1)).force("y", d3.forceY(d => rows[d.yr]).strength(0.06))
      .force("c", d3.forceCollide(R + 0.7)).stop().tick(260);
    return nodes;
  };
  const pos = { linear: layout(lin), log: layout(log) };
  const colorFor = (yr, m) => m === "log" ? (yr === 2019 ? ORANGE : ORANGE2) : (yr === 2019 ? TEAL : TEAL2);

  const axisG = gBack.append("g"), labG = gTop.append("g");
  function drawAxis(m) {
    axisG.selectAll("*").remove(); labG.selectAll("*").remove();
    const sc = m === "log" ? log : lin;
    const ticks = m === "log" ? [2, 5, 10, 20, 50, 100, 200, 400] : [0, 50, 100, 150, 200, 250, 300, 350, 400];
    ticks.forEach(t => {
      axisG.append("line").attr("class", "grid").attr("x1", sc(t)).attr("x2", sc(t)).attr("y1", 20).attr("y2", H - 66);
      text(axisG, sc(t), H - 46, t, "tick", null, "middle");
    });
    text(axisG, (M.l + W - M.r) / 2, H - 20, m === "log" ? "Deaths per 1,000 births, logarithmic scale" : "Deaths per 1,000 births", "axis-title", null, "middle");
    text(axisG, 0, 0, "Year", "axis-title", null, "middle").attr("transform", `translate(12,${(rows[1960] + rows[2019]) / 2}) rotate(-90)`);
    [1960, 2019].forEach(yr => {
      const vals = pts.filter(p => p.yr === yr).map(p => p.val);
      const lo = d3.min(vals), hi = d3.max(vals), yy = d3.min(pos[m].filter(n => n.yr === yr), n => n.y) - 16;
      text(labG, 32, rows[yr] + 5, yr, "row");
      labG.append("path").attr("fill", "none").attr("stroke", "#121212").attr("stroke-width", 1)
        .attr("d", `M${sc(lo)},${yy + 5} V${yy} H${sc(hi)} V${yy + 5}`);
      const label = m === "log" ? `${f0(hi / lo)}× from lowest to highest` : `${f0(hi - lo)} deaths from lowest to highest`;
      text(labG, (sc(lo) + sc(hi)) / 2, yy - 7, label, "lab halo", yr === 2019 ? colorFor(2019, m) : "#121212", "middle");
    });
  }
  const dots = g.selectAll("circle").data(pos[mode]).join("circle")
    .attr("cx", d => d.x).attr("cy", d => d.y).attr("r", R).attr("fill", d => colorFor(d.yr, mode))
    .attr("stroke", "#fff").attr("stroke-width", 0.8);
  drawAxis(mode);

  if (opts.interactive) {
    const tip = d3.select("#tip");
    dots.on("mousemove", (e, d) => tip.style("opacity", 1).style("left", e.clientX + 12 + "px").style("top", e.clientY - 10 + "px")
        .html(`<b>${d.name}</b>1960: ${f1(d.v60)} &nbsp; 2019: ${f1(d.v19)}<br>deaths per 1,000 births`))
      .on("mouseleave", () => tip.style("opacity", 0));
    const ctrl = d3.select("#ctrl").append("div").attr("class", "ctrl");
    [["linear", "Linear scale"], ["log", "Logarithmic scale"]].forEach(([m, lab]) =>
      ctrl.append("button").attr("aria-pressed", m === mode).text(lab).on("click", function () {
        ctrl.selectAll("button").attr("aria-pressed", false); d3.select(this).attr("aria-pressed", true);
        const byKey = new Map(pos[m].map(n => [n.name + n.yr, n]));
        dots.transition().duration(1100).ease(d3.easeCubicInOut)
          .attr("cx", d => byKey.get(d.name + d.yr).x).attr("cy", d => byKey.get(d.name + d.yr).y).attr("fill", d => colorFor(d.yr, m));
        labG.style("opacity", 0); setTimeout(() => { drawAxis(m); labG.style("opacity", 1); }, 650);
      }));
  }
  return { lin, log, rows };
}

function for2(D) {
  d3.select("#title").text("Nearly every country now sits close to zero");
  d3.select("#dek").text("Each dot is a country. Deaths before age 5 per 1,000 births.");
  const { lin, rows } = swarm(D, "linear");
  marker(1, lin(270), rows[2019], TEAL);    // linear scale
  marker(2, 18, rows[1960] - 34, TEAL);          // two endpoint years only
  marker(3, lin(350), rows[1960] + 22, TEAL);    // every country shown
}

function against2(D) {
  d3.select("#title").text("Countries are further apart than they were in 1960");
  d3.select("#dek").text("Each dot is a country, on a scale where every step multiplies the rate.");
  const { log, rows } = swarm(D, "log");
  marker(1, log(300), rows[2019] + 26, ORANGE);  // log scale
  marker(2, log(2.6), rows[2019] - 50, ORANGE);  // extremes, single countries
  marker(3, log(60), rows[2019] + 30, ORANGE);   // color
}

function morph(D) {
  d3.select("#title").remove();
  d3.select("#dek").remove();
  d3.select("#src").remove();
  swarm(D, "linear", { interactive: true });
  if (P.has("clicklog")) setTimeout(() => document.querySelectorAll(".ctrl button")[1].click(), 300);
}
</script>
